<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迁移一体机 · 车载数据迁移平台</title>
<style>
/* ============ 0. Token ============ */
:root{
  --navy:#001529; --navy-600:#12395C; --navy-700:#0B2740;
  --page:#F0F2F5; --surface:#FFF; --border:#E8E8E8; --border-2:#F0F0F0;
  --text:#141414; --text-2:#595959; --text-3:#8C8C8C;
  --primary:#1677FF; --primary-h:#4096FF; --primary-bg:#E6F4FF;

  /* Signature：强调橙，仅用于「进行中 / 能量/迁移」状态，不做装饰铺底 */
  --amber:#FA8C16; --amber-bg:#FFF7E6; --amber-line:#FFD591;

  --green:#52C41A; --green-bg:#F6FFED; --green-line:#B7EB8F;
  --red:#FF4D4F; --red-bg:#FFF1F0; --red-line:#FFA39E;
  --yellow:#FAAD14; --yellow-bg:#FFFBE6;

  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:22px;color:var(--text);background:var(--page);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
::selection{background:#BAE0FF}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.muted{color:var(--text-3)}
.sec{color:var(--text-2)}
.nowrap{white-space:nowrap}

/* ============ 1. Shell ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:56px;z-index:60;
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 20px;
}
.hamburger{display:none;width:32px;height:32px;border:1px solid var(--border);background:#fff;border-radius:6px;align-items:center;justify-content:center;cursor:pointer}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{
  width:28px;height:28px;border-radius:6px;background:var(--primary);
  display:grid;place-items:center;flex:none;
}
.brand-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-t b{font-size:15px;font-weight:600;letter-spacing:.2px}
.brand-t span{font-size:11px;color:var(--text-3);letter-spacing:.4px;margin-top:2px}

.portal-switch{
  display:flex;align-items:center;gap:2px;padding:2px;margin-left:8px;
  background:#F5F5F5;border:1px solid var(--border);border-radius:6px;
}
.portal-switch button{
  height:28px;padding:0 12px;border:none;background:transparent;border-radius:4px;
  font-size:13px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;gap:6px;
}
.portal-switch button.on{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.portal-switch button.on svg{color:var(--primary)}
.topbar .spacer{flex:1}
.topbar .env{
  display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;
  border:1px solid var(--border);border-radius:4px;font-size:12px;color:var(--text-2);background:#FAFAFA;
}
.topbar .env i{width:5px;height:5px;border-radius:50%;background:var(--green);display:block}
.icon-btn{
  width:32px;height:32px;border:none;background:transparent;border-radius:6px;
  display:grid;place-items:center;color:var(--text-2);cursor:pointer;position:relative;
}
.icon-btn:hover{background:#F5F5F5;color:var(--text)}
.icon-btn b{
  position:absolute;top:3px;right:2px;min-width:14px;height:14px;border-radius:7px;
  background:var(--red);color:#fff;font-size:10px;line-height:14px;font-weight:500;padding:0 3px;
}
.avatar{
  width:28px;height:28px;border-radius:50%;background:#E6F4FF;color:var(--primary);
  display:grid;place-items:center;font-size:12px;font-weight:600;flex:none;
}

.sidebar{
  position:fixed;top:56px;left:0;bottom:0;width:208px;z-index:50;
  background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;
}
.nav-sec{padding:18px 16px 6px;font-size:11px;color:rgba(255,255,255,.32);letter-spacing:.08em}
.nav-item{
  display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;margin:2px 8px;
  border-radius:6px;color:rgba(255,255,255,.66);font-size:13px;cursor:pointer;
  position:relative;transition:background .12s;
}
.nav-item svg{flex:none;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:var(--navy-600);color:#fff;font-weight:500}
.nav-item.on::before{
  content:"";position:absolute;left:-8px;top:11px;bottom:11px;width:2px;
  background:var(--amber);border-radius:0 2px 2px 0;
}
.nav-item.on svg{color:#fff;opacity:1}
.nav-item .n-badge{
  margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;
  background:var(--red);color:#fff;font-size:11px;line-height:18px;text-align:center;font-family:var(--mono);
}
.side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{display:flex;align-items:center;gap:10px}
.side-user .avatar{background:rgba(255,255,255,.12);color:#fff}
.side-user .u-t{line-height:1.3;min-width:0}
.side-user .u-t b{display:block;font-size:12.5px;color:#fff;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .u-t span{font-size:11px;color:rgba(255,255,255,.42)}

.main{margin-left:208px;padding-top:56px;min-height:100vh}
.main-inner{padding:20px 24px 48px;max-width:1440px}
.scrim{display:none;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.4);z-index:45}

/* ============ 2. Common ============ */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:8px}
.crumb a{cursor:pointer}
.crumb a:hover{color:var(--primary)}
.page-title{margin:0;font-size:20px;font-weight:600;line-height:28px;letter-spacing:-.2px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.page-sub{font-size:13px;color:var(--text-3);margin-top:4px}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{
  height:32px;padding:0 14px;border-radius:6px;border:1px solid #D9D9D9;background:#fff;
  font-size:13px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:6px;white-space:nowrap;transition:all .12s;
}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-h);border-color:var(--primary-h);color:#fff}
.btn-ghost{border-color:transparent;background:transparent;color:var(--text-2);padding:0 8px}
.btn-ghost:hover{background:#F5F5F5;color:var(--primary)}
.btn-danger{color:var(--red);border-color:#FFCCC7}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.link{color:var(--primary);cursor:pointer;font-size:13px}
.link:hover{color:var(--primary-h);text-decoration:underline}

.pill{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;
  font-size:12px;line-height:1;white-space:nowrap;border:1px solid transparent;
}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill-blue{background:var(--primary-bg);color:#0958D9;border-color:#91CAFF}
.pill-green{background:var(--green-bg);color:#389E0D;border-color:var(--green-line)}
.pill-amber{background:var(--amber-bg);color:#D46B08;border-color:var(--amber-line)}
.pill-red{background:var(--red-bg);color:#CF1322;border-color:var(--red-line)}
.pill-gray{background:#FAFAFA;color:#8C8C8C;border-color:var(--border)}

.panel{background:#fff;border:1px solid var(--border);border-radius:var(--r)}
.panel + .panel{margin-top:16px}
.panel-head{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid var(--border-2)}
.panel-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-title .cnt{font-size:12px;color:var(--text-3);font-weight:400}
.panel-body{padding:18px}
.panel-body.tight{padding:0}

.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;position:relative;overflow:hidden}
.kpi-k{font-size:13px;color:var(--text-2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.kpi-v{font-size:24px;font-weight:600;line-height:32px;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi-v small{font-size:13px;font-weight:400;color:var(--text-3);margin-left:4px;letter-spacing:0}
.kpi-f{font-size:12px;color:var(--text-3);margin-top:4px;display:flex;align-items:center;gap:6px}
.spark{display:block;margin-top:8px}

/* table */
.tbl-scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  height:44px;text-align:left;font-weight:400;color:var(--text-3);font-size:12px;
  background:#FAFAFA;padding:0 14px;border-bottom:1px solid var(--border);white-space:nowrap;
}
.tbl td{height:52px;padding:0 14px;border-bottom:1px solid var(--border-2);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#FAFBFC}
.tbl .cell-main{font-size:13px}
.tbl .cell-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.tbl .ops{display:flex;align-items:center;gap:12px}
.tbl .ops .link{font-size:12px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

.filterbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filterbar .grow{flex:1}
.chips{display:flex;gap:2px;background:#F5F5F5;padding:3px;border-radius:6px;flex-wrap:wrap}
.chip{
  height:26px;padding:0 12px;border-radius:4px;font-size:13px;color:var(--text-2);
  cursor:pointer;display:flex;align-items:center;gap:6px;border:none;background:transparent;
}
.chip:hover{color:var(--text)}
.chip.on{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chip b{font-weight:400;color:var(--text-3);font-size:12px;font-family:var(--mono)}
.chip.on b{color:var(--primary)}

.input,.select{
  height:32px;border:1px solid #D9D9D9;border-radius:6px;padding:0 10px;font-size:13px;
  font-family:inherit;color:var(--text);background:#fff;outline:none;min-width:0;
}
.input::placeholder{color:#BFBFBF}
.input:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,119,255,.1)}
.select{padding-right:26px;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238C8C8C' fill='none' stroke-width='1.4'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
.search{position:relative;display:inline-flex}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#BFBFBF;pointer-events:none}
.search .input{padding-left:30px;width:230px}

.tbl-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3);flex-wrap:wrap}
.pager{display:flex;align-items:center;gap:4px}
.pager button{min-width:28px;height:28px;border:1px solid var(--border);background:#fff;border-radius:4px;font-size:12px;color:var(--text-2);cursor:pointer;font-family:var(--mono)}
.pager button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* progress */
.bar{height:4px;background:#F0F0F0;border-radius:2px;overflow:hidden;min-width:56px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.bar.amber>i{background:var(--amber)}
.bar.green>i{background:var(--green)}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-row .pc{font-size:12px;color:var(--text-2);font-family:var(--mono);min-width:32px;text-align:right}

/* lifecycle rail — Signature */
.rail{display:flex;align-items:flex-start}
.rail-step{flex:1;position:relative;min-width:0;padding-right:8px}
.rail-step::before{
  content:"";position:absolute;left:13px;right:-13px;top:5px;height:2px;background:#F0F0F0;z-index:0;
}
.rail-step:last-child::before{display:none}
.rail-step.done::before{background:var(--primary)}
.rail-step.active::before{background:linear-gradient(90deg,var(--primary),#F0F0F0)}
.rail-dot{
  width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #D9D9D9;
  position:relative;z-index:1;display:grid;place-items:center;
}
.rail-step.done .rail-dot{background:var(--primary);border-color:var(--primary)}
.rail-step.active .rail-dot{border-color:var(--amber);background:#fff}
.rail-step.active .rail-dot::after{
  content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--amber);opacity:.5;
  animation:ripple 2.2s ease-out infinite;
}
@keyframes ripple{0%{transform:scale(.7);opacity:.6}70%{transform:scale(1.35);opacity:0}100%{opacity:0}}
.rail-lab{font-size:13px;color:var(--text-3);margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-step.done .rail-lab,.rail-step.active .rail-lab{color:var(--text)}
.rail-step.active .rail-lab{font-weight:500;color:#D46B08}
.rail-time{font-size:11.5px;color:#BFBFBF;font-family:var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail.dense .rail-lab{font-size:12px}
.rail.dense .rail-time{font-size:11px}

/* tabs */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto}
.tab{
  height:44px;display:flex;align-items:center;font-size:14px;color:var(--text-2);
  cursor:pointer;position:relative;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.tab b{font-weight:400;color:var(--text-3);margin-left:6px;font-family:var(--mono);font-size:12px}

/* definition list */
.dl{display:grid;grid-template-columns:96px 1fr;row-gap:12px;column-gap:12px;font-size:13px}
.dl dt{color:var(--text-3);margin:0}
.dl dd{margin:0;color:var(--text);word-break:break-word}
.dl.two{grid-template-columns:1fr 1fr 1fr 1fr}

/* timeline */
.tl{padding-left:18px;position:relative}
.tl-item{position:relative;padding-bottom:16px;font-size:13px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-14px;top:5px;width:7px;height:7px;border-radius:50%;background:#D9D9D9;z-index:1}
.tl-item:not(:last-child)::after{content:"";position:absolute;left:-11px;top:13px;bottom:0;width:1px;background:var(--border)}
.tl-item.hl::before{background:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.tl-t{font-size:12.5px;color:var(--text)}
.tl-m{font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-top:2px}

/* metrics strip (详情页指标，非 KPI 墙) */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border);border-radius:var(--r);background:#fff;overflow:hidden}
.metric{padding:14px 16px;border-right:1px solid var(--border-2);min-width:0}
.metric:last-child{border-right:none}
.metrics.five{grid-template-columns:1.15fr .8fr .9fr 1.1fr 1.1fr}
.metric-k{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-v{font-size:18px;font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.metric-v small{font-size:12px;font-weight:400;color:var(--text-3);margin-left:3px}

/* notice */
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:6px;font-size:13px;line-height:20px;border:1px solid}
.notice svg{flex:none;margin-top:2px}
.notice-info{background:#F7FBFF;border-color:#91CAFF;color:#0958D9}
.notice-amber{background:var(--amber-bg);border-color:var(--amber-line);color:#AD4E00}
.notice-gray{background:#FAFAFA;border-color:var(--border);color:var(--text-2)}

/* wizard */
.wizard{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.steps{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3)}
.step-n{width:22px;height:22px;border-radius:50%;border:1px solid #D9D9D9;display:grid;place-items:center;font-size:12px;font-family:var(--mono);background:#fff;flex:none}
.step.on{color:var(--text);font-weight:500}
.step.on .step-n{background:var(--primary);border-color:var(--primary);color:#fff}
.step.done .step-n{background:var(--primary-bg);border-color:#91CAFF;color:var(--primary)}
.step.done{color:var(--text-2)}
.step-line{flex:1;min-width:16px;height:1px;background:var(--border)}
.form-sec{margin-bottom:24px}
.form-sec:last-child{margin-bottom:0}
.form-sec-t{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.form-sec-t span{font-size:12px;color:var(--text-3);font-weight:400}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field>label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--text-3);margin-top:5px}
.field .input,.field .select{width:100%;height:34px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.opt{
  border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;background:#fff;
  position:relative;transition:.12s;
}
.opt:hover{border-color:#91CAFF}
.opt.on{border-color:var(--primary);background:#F7FBFF;box-shadow:inset 0 0 0 1px var(--primary)}
.opt-n{font-size:14px;font-weight:600;padding-right:20px}
.opt-c{font-size:12px;color:var(--text-3);margin-top:4px}
.opt-p{font-size:13px;color:var(--primary);font-weight:600;margin-top:10px;font-variant-numeric:tabular-nums}
.opt-check{
  position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;border:1px solid #D9D9D9;background:#fff;
}
.opt.on .opt-check{border:4px solid var(--primary)}
.stepper{display:inline-flex;border:1px solid #D9D9D9;border-radius:6px;overflow:hidden;height:34px;background:#fff}
.stepper button{width:34px;border:none;background:#fff;cursor:pointer;font-size:16px;color:var(--text-2);line-height:1}
.stepper button:hover{background:#F5F5F5;color:var(--primary)}
.stepper input{width:52px;border:none;border-left:1px solid var(--border);border-right:1px solid var(--border);text-align:center;font-family:var(--mono);font-size:13px;outline:none;color:var(--text)}
.summary{position:sticky;top:76px}
.summary .panel-body{padding:16px 18px}
.sum-line{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;padding:7px 0;color:var(--text-2)}
.sum-line b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.sum-total{border-top:1px dashed var(--border);margin-top:8px;padding-top:12px;display:flex;align-items:baseline;justify-content:space-between}
.sum-total span{font-size:13px;color:var(--text-2)}
.sum-total b{font-size:20px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.wiz-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-2)}
.radio-line{display:flex;gap:18px;flex-wrap:wrap;padding-top:2px}
.radio{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text);cursor:pointer}
.radio i{width:14px;height:14px;border-radius:50%;border:1px solid #D9D9D9;background:#fff;position:relative;flex:none}
.radio.on i{border:4px solid var(--primary)}
.check{display:inline-flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-2);cursor:pointer;line-height:20px}
.check i{width:15px;height:15px;border-radius:3px;border:1px solid #D9D9D9;background:#fff;flex:none;margin-top:2px;display:grid;place-items:center}
.check.on i{background:var(--primary);border-color:var(--primary)}
.check.on i::after{content:"";width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}

/* detail layout */
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.side-card .panel-head{min-height:46px;padding:0 16px}
.side-card .panel-body{padding:14px 16px}

/* order card on dashboard */
.oc{border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;background:#fff}
.oc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.oc-id{font-family:var(--mono);font-size:13px;color:var(--text);cursor:pointer}
.oc-id:hover{color:var(--primary)}
.oc-meta{display:flex;gap:20px;flex-wrap:wrap;font-size:12.5px;color:var(--text-3);margin-top:6px}
.oc-rail{margin-top:18px}
.oc-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border-2);font-size:12.5px;color:var(--text-3);flex-wrap:wrap}

/* todo list */
.todo{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border-2);cursor:pointer}
.todo:last-child{border-bottom:none}
.todo:hover{background:#FAFBFC}
.todo-ic{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;flex:none}
.todo-b{flex:1;min-width:0}
.todo-t{font-size:13px;color:var(--text)}
.todo-s{font-size:12px;color:var(--text-3);margin-top:2px}
.todo-n{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text)}
.todo-go{color:#BFBFBF}

/* empty */
.empty{padding:48px 20px;text-align:center;color:var(--text-3);font-size:13px}
.empty b{display:block;color:var(--text-2);font-size:14px;font-weight:500;margin-bottom:6px}
.empty .btn{margin-top:14px}

/* modal */
.mask{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;
  display:none;align-items:flex-start;justify-content:center;padding:64px 20px 40px;overflow:auto;
}
.mask.on{display:flex}
.modal{background:#fff;border-radius:var(--r);width:560px;max-width:100%;animation:pop .14s ease-out}
.modal.wide{width:720px}
@keyframes pop{from{transform:translateY(-6px);opacity:.6}to{transform:none;opacity:1}}
.modal-head{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;border-bottom:1px solid var(--border-2);font-size:16px;font-weight:600}
.modal-head .x{border:none;background:transparent;cursor:pointer;color:var(--text-3);width:28px;height:28px;border-radius:4px;display:grid;place-items:center}
.modal-head .x:hover{background:#F5F5F5;color:var(--text)}
.modal-body{padding:20px;font-size:13px;line-height:22px}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border-2);display:flex;justify-content:flex-end;gap:8px;background:#FAFAFA;border-radius:0 0 var(--r) var(--r);flex-wrap:wrap}

/* toast */
.toast{
  position:fixed;left:50%;top:72px;transform:translate(-50%,-10px);z-index:200;
  background:#141414;color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:.18s;
  box-shadow:0 4px 16px rgba(0,0,0,.18);max-width:calc(100vw - 32px);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#52C41A;flex:none}

/* device drawer detail bits */
.dev-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.dev-ic{width:44px;height:44px;border-radius:8px;background:#F5F7FA;display:grid;place-items:center;color:var(--text-2);flex:none;border:1px solid var(--border)}
.hero-num{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.4px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font-size:11px;background:#F5F5F5;color:var(--text-2);border:1px solid var(--border)}

/* inventory checkbox */
.cb{width:15px;height:15px;border:1px solid #D9D9D9;border-radius:3px;background:#fff;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle}
.cb.on{background:var(--primary);border-color:var(--primary)}
.cb.on::after{content:"";width:7px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
tr.sel td{background:#F7FBFF}
.batchbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#F7FBFF;border-bottom:1px solid #91CAFF;font-size:13px;color:#0958D9;flex-wrap:wrap}

/* chart */
.chart-box{padding:8px 0 0}
.chart-legend{display:flex;gap:16px;font-size:12px;color:var(--text-3);margin-top:8px}
.chart-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:5px}

/* warehouse rows */
.wh-row{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr 1.4fr;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--border-2);font-size:13px}
.wh-row:last-child{border-bottom:none}
.wh-row.h{background:#FAFAFA;font-size:12px;color:var(--text-3);padding:9px 18px}

/* ============ 3. Responsive ============ */
@media (max-width:1180px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .wizard{grid-template-columns:minmax(0,1fr)}
  .summary{position:static}
  .detail-grid{grid-template-columns:minmax(0,1fr)}
  .opt-grid{grid-template-columns:1fr}
}
@media (max-width:900px){
  .hamburger{display:flex}
  .sidebar{transform:translateX(-100%);transition:transform .2s}
  .app.nav-open .sidebar{transform:translateX(0)}
  .app.nav-open .scrim{display:block}
  .main{margin-left:0}
  .main-inner{padding:16px 14px 40px}
  .metrics{grid-template-columns:1fr 1fr}
  .metric:nth-child(2){border-right:none}
  .metric:nth-child(1),.metric:nth-child(2){border-bottom:1px solid var(--border-2)}
  .brand-t span{display:none}
  .portal-switch{margin-left:0}
  .portal-switch button{padding:0 9px;font-size:12px}
  .topbar{gap:10px;padding:0 12px}
  .topbar .env{display:none}
}
@media (max-width:720px){
  .kpi-row{grid-template-columns:1fr}
  .field-row{grid-template-columns:1fr}
  .filterbar{padding:10px 12px;gap:8px}
  .search .input{width:100%}
  .search{flex:1}
  .tbl{min-width:0}
  .tbl thead{display:none}
  .tbl tbody tr{display:block;padding:10px 0;border-bottom:1px solid var(--border)}
  .tbl tbody tr:last-child{border-bottom:none}
  .tbl td{display:flex;justify-content:space-between;align-items:center;gap:14px;height:auto;padding:5px 14px;border:none;text-align:left!important}
  .tbl td::before{content:attr(data-l);color:var(--text-3);font-size:12px;flex:none}
  .tbl td:first-child{padding-top:2px}
  .tbl td .cell-sub{display:none}
  .tbl .ops{justify-content:flex-end;flex-wrap:wrap}
  .tbl td.no-l::before{display:none}
  .tbl td>span.mono{flex:1;min-width:0;text-align:right;overflow-wrap:anywhere}
  .tbl td>div.cell-main{flex:1;min-width:0;text-align:right}
  .page-title{font-size:18px}
  .panel-body{padding:14px}
  .dl{grid-template-columns:84px 1fr}
  .rail-lab{font-size:11.5px}
  .rail-time{display:none}
  .wh-row{grid-template-columns:1fr 1fr;row-gap:6px}
  .wh-row.h{display:none}
  .oc-meta{gap:10px 16px}
  .page-head{gap:10px}
  .head-actions .btn{flex:1}
  .tabs{gap:18px;padding:0 12px}
}

function buildLogs(o){
  const L=[{t:o.createdAt,who:o.contact||'客户',what:'提交订单',note:MODELS[o.model].name+' × '+o.qty+' 台'}];
  if(o.shippedAt) L.push({t:o.shippedAt,who:'运维 · 张磊',what:'订单受理，设备出库',note:'杭州仓 → '+o.site});
  if(o.confirmedAt) L.push({t:o.confirmedAt,who:o.contact||'客户',what:'确认收货',note:'设备上电自检通过，迁移任务排队中'});
  if(o.status==='using') L.push({t:(o.confirmedAt||o.createdAt).slice(0,10)+' 20:00',who:'系统',what:'迁移任务启动',note:'夜间窗口 · 目标 '+o.region});
  if(o.returnAt) L.push({t:o.returnAt,who:o.contact||'客户',what:'申请归还设备',note:'顺丰 SF7788990011'});
  if(o.completedAt) L.push({t:o.completedAt,who:'运维 · 张磊',what:'设备入库检测通过',note:'订单关闭'});
  if(o.status==='cancelled') L.push({t:o.createdAt.slice(0,10)+' 18:30',who:o.contact||'客户',what:'取消订单',note:'项目排期变更'});
  return L.reverse();
}

function spark(vals,color){
  const w=112,h=26,max=Math.max.apply(null,vals),min=Math.min.apply(null,vals);
  const pts=vals.map((v,i)=>{
    const x=(i/(vals.length-1)*w).toFixed(1);
    const y=(h-3-((v-min)/((max-min)||1))*(h-8)).toFixed(1);
    return x+','+y;
  }).join(' ');
  return '<svg class="spark" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true">'
    + '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function clientDevices(){
  const sns=new Set();
  DB.orders.forEach(o=>o.devices.forEach(s=>sns.add(s)));
  const all=DB.devices.filter(d=>sns.has(d.sn));
  const counts={
    all:all.length,
    in_use:all.filter(d=>d.status==='in_use').length,
    move:all.filter(d=>['shipping','locked'].includes(d.status)).length,
    back:all.filter(d=>['returning','inspecting'].includes(d.status)).length,
    done:all.filter(d=>d.status==='stock').length
  };
  let list=all;
  if(ui.filters.dev!=='all'){
    if(ui.filters.dev==='in_use') list=all.filter(d=>d.status==='in_use');
    if(ui.filters.dev==='move') list=all.filter(d=>['shipping','locked'].includes(d.status));
    if(ui.filters.dev==='back') list=all.filter(d=>['returning','inspecting'].includes(d.status));
    if(ui.filters.dev==='done') list=all.filter(d=>d.status==='stock');
  }
  const q=(ui.q.dev||'').trim().toLowerCase();
  if(q) list=list.filter(d=>(d.sn+d.order+'').toLowerCase().includes(q));

  const chips=[['all','全部',counts.all],['in_use','使用中',counts.in_use],['move','在途',counts.move],['back','待归还',counts.back],['done','已回库',counts.done]]
    .map(c=>'<button class="chip'+(ui.filters.dev===c[0]?' on':'')+'" data-act="filter-dev" data-k="'+c[0]+'">'+c[1]+'<b>'+c[2]+'</b></button>').join('');

  const rows=list.map(d=>{
    const o=d.order?orderById(d.order):null;
    return '<tr>'
      + '<td data-l="设备 SN"><span class="mono">'+d.sn+'</span><div class="cell-sub">'+MODELS[d.model].name+'</div></td>'
      + '<td data-l="设备状态">'+dPill(d)+'</td>'
      + '<td data-l="容量使用"><div class="bar-row"><div class="bar'+(d.used?' amber':'')+'" style="width:96px"><i style="width:'+pct(d.used,d.cap)+'%"></i></div><span class="pc">'+pct(d.used,d.cap)+'%</span></div></td>'
      + '<td data-l="所属订单"><span class="mono">'+(d.order||'—')+'</span></td>'
      + '<td data-l="最后心跳" class="mono muted">'+d.hb+'</td>'
      + '<td data-l="操作" class="no-l"><div class="ops"><a class="link" data-act="open-device" data-sn="'+d.sn+'">详情</a>'
      + (o&&o.status==='using'?'<a class="link" data-act="swap-one" data-id="'+o.id+'" data-sn="'+d.sn+'">更换</a>':'')+'</div></td></tr>';
  }).join('');

  return head('设备管理','共 '+all.length+' 台设备 · 数据迁移中 '+counts.in_use+' 台',
      '<button class="btn" data-act="export">'+ic('down',14)+'导出清单</button>')
    + '<div class="panel"><div class="filterbar"><div class="chips">'+chips+'</div><span class="grow"></span>'
      + '<label class="search">'+ic('search',14)+'<input class="input" id="qDev" data-q="dev" placeholder="搜索设备 SN / 订单号" value="'+esc(ui.q.dev||'')+'"></label>'
    + '</div><div class="tbl-scroll"><table class="tbl"><thead><tr>'
      + '<th>设备 SN</th><th>设备状态</th><th>容量使用</th><th>所属订单</th><th>最后心跳</th><th style="text-align:right">操作</th>'
      + '</tr></thead><tbody>'+(list.length?rows:'<tr><td colspan="6">'+emptyBox('没有匹配的设备','清空筛选后再试','<button class="btn btn-sm" data-act="reset-dev">清空筛选</button>')+'</td></tr>')+'</tbody></table></div>'
    + pager(all.length,list.length)+'</div>';

/* ================= 设备详情（客户 / 运维共用） ================= */
function devicePage(mode){
  const d=deviceBySn(ui.params.sn)||DB.devices[0];
  const o=d.order?orderById(d.order):null;
  const p=pct(d.used,d.cap);
  const isOps=mode==='ops';

  const actions = isOps
    ? (d.status==='stock'?'<button class="btn btn-primary" data-act="unshelve" data-sn="'+d.sn+'">下架</button>'
      : d.status==='offshelf'||d.status==='inspecting'?'<button class="btn btn-primary" data-act="shelve" data-sn="'+d.sn+'">上架</button>'
      : d.status==='repair'?'<button class="btn btn-primary" data-act="shelve" data-sn="'+d.sn+'">修复上架</button>'
      : '<button class="btn" data-act="unshelve" data-sn="'+d.sn+'" disabled>当前状态不可操作</button>')
      + '<button class="btn" data-act="repair" data-sn="'+d.sn+'">报修</button>'
    : (o&&o.status==='using'?'<button class="btn" data-act="report" data-sn="'+d.sn+'">报障</button><button class="btn btn-primary" data-act="swap-one" data-id="'+o.id+'" data-sn="'+d.sn+'">申请更换</button>'
      : '<button class="btn" data-act="report" data-sn="'+d.sn+'">报障</button>');

  const kpis='<div class="metrics">'
    + '<div class="metric"><div class="metric-k">已迁移数据</div><div class="metric-v">'+d.used.toFixed(1)+'<small>TB</small></div></div>'
    + '<div class="metric"><div class="metric-k">实时速率</div><div class="metric-v">'+(d.rate?d.rate.toFixed(2):'0.00')+'<small>Gbps</small></div></div>'
    + '<div class="metric"><div class="metric-k">设备温度</div><div class="metric-v">'+(d.temp||'—')+'<small>'+(d.temp?'°C':'')+'</small></div></div>'
    + '<div class="metric"><div class="metric-k">固件版本</div><div class="metric-v" style="font-family:var(--mono);font-size:15px">'+d.fw+'</div></div>'
    + '</div>';

  const trend = (function(){
    const vals=[]; const n=7;
    for(let i=0;i<n;i++){ vals.push(Math.round(d.used*(i/(n-1))*10)/10); }
    return vals;
  })();
  const chartW=560,chartH=150,pad=26;
  const maxV=Math.max(d.cap*0.5,Math.max.apply(null,trend),1);
  const pts=trend.map((v,i)=>{
    const x=pad+i*(chartW-2*pad)/(trend.length-1);
    const y=chartH-pad-(v/maxV)*(chartH-2*pad);
    return [x,y];
  });
  const poly=pts.map(p2=>p2[0].toFixed(1)+','+p2[1].toFixed(1)).join(' ');
  const area='M'+pts[0][0].toFixed(1)+','+(chartH-pad)+' L'+poly.replace(/ /g,' L')+' L'+pts[pts.length-1][0].toFixed(1)+','+(chartH-pad)+' Z';
  const chart='<svg viewBox="0 0 '+chartW+' '+chartH+'" style="width:100%;height:auto;display:block" role="img" aria-label="容量增长趋势">'
    + [0,1,2,3].map(i=>'<line x1="'+pad+'" x2="'+(chartW-pad)+'" y1="'+(pad+i*(chartH-2*pad)/3).toFixed(1)+'" y2="'+(pad+i*(chartH-2*pad)/3).toFixed(1)+'" stroke="#F0F0F0" stroke-width="1"/>').join('')
    + '<path d="'+area+'" fill="#FFF7E6" opacity=".8"/>'
    + '<polyline points="'+poly+'" fill="none" stroke="#FA8C16" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    + pts.map(p2=>'<circle cx="'+p2[0].toFixed(1)+'" cy="'+p2[1].toFixed(1)+'" r="2.4" fill="#fff" stroke="#FA8C16" stroke-width="1.6"/>').join('')
    + '</svg><div class="chart-legend"><span><i style="background:#FA8C16"></i>累计迁移量（TB）</span><span>近 7 天 · 每 24h 采样</span></div>';

  const events=[
    {t:d.hb,w:'心跳上报',n:'速率 '+(d.rate||0)+' Gbps · 温度 '+(d.temp||0)+'°C'},
    {t:'2026-10-18 02:10',w:'迁移任务分片完成',n:'分片 12/36 校验通过'},
    {t:'2026-10-17 23:40',w:'网络抖动',n:'重传 3 次后恢复，无数据丢失'},
    {t:d.since+' 09:00',w:'设备上线',n:'固件 '+d.fw+' · 自检通过'}
  ];

  const info='<div class="panel-body"><div class="dl">'
    + '<dt>设备型号</dt><dd>'+MODELS[d.model].name+'</dd>'
    + '<dt>额定容量</dt><dd>'+d.cap+' TB</dd>'
    + '<dt>所在仓库</dt><dd>'+esc(d.wh)+'</dd>'
    + '<dt>部署位置</dt><dd>'+esc(d.site)+'</dd>'
    + '<dt>上线时间</dt><dd>'+d.since+'</dd>'
    + '<dt>最后心跳</dt><dd>'+d.hb+'</dd>'
    + '<dt>归属订单</dt><dd>'+(o?'<a class="link" data-act="open-order" data-id="'+o.id+'">'+o.id+'</a>':'—')+'</dd>'
    + '</div></div>';

  return head('<span class="mono" style="font-size:18px">'+d.sn+'</span>'+dPill(d),
      MODELS[d.model].name+' · '+esc(d.site),
      actions, crumbBack(isOps?'设备库存':'设备管理'))
    + kpis
    + '<div class="detail-grid" style="margin-top:16px"><div>'
      + '<div class="panel"><div class="panel-head"><div class="panel-title">容量与迁移进度</div><span class="cnt">'+d.used.toFixed(1)+' / '+d.cap+' TB</span></div>'
      + '<div class="panel-body"><div class="bar amber" style="height:6px;margin-bottom:4px"><i style="width:'+p+'%"></i></div>'
      + '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-3);margin-bottom:16px"><span>已用 '+p+'%</span><span>剩余 '+(d.cap-d.used).toFixed(1)+' TB</span></div>'
      + '<div class="chart-box">'+chart+'</div></div></div>'
      + '<div class="panel"><div class="panel-head"><div class="panel-title">设备事件</div></div><div class="panel-body"><div class="tl">'
        + events.map((e,i)=>'<div class="tl-item'+(i===0?' hl':'')+'"><div class="tl-t">'+e.w+'</div><div class="tl-m">'+e.t+'</div><div style="font-size:12.5px;color:var(--text-2)">'+e.n+'</div></div>').join('')
      + '</div></div></div>'
    + '</div><div>'
      + '<div class="panel side-card"><div class="panel-head"><div class="panel-title" style="font-size:13px">设备信息</div></div>'+info+'</div>'
      + '<div class="panel side-card"><div class="panel-head"><div class="panel-title" style="font-size:13px">快捷操作</div></div><div class="panel-body" style="display:flex;flex-direction:column;gap:8px">'
        + (isOps
            ? '<button class="btn btn-sm" data-act="restart" data-sn="'+d.sn+'">远程重启</button><button class="btn btn-sm" data-act="repair" data-sn="'+d.sn+'">转维修</button><button class="btn btn-sm btn-danger" data-act="scrap" data-sn="'+d.sn+'">报废登记</button>'
            : '<button class="btn btn-sm" data-act="restart" data-sn="'+d.sn+'">重启诊断</button><button class="btn btn-sm" data-act="report" data-sn="'+d.sn+'">提交工单</button><button class="btn btn-sm" data-act="contact">联系运维</button>')
      + '</div></div>'
    + '</div></div>';
}

function typeTag(t){
  const map={'入库':'amber','出库':'blue','上架':'green','下架':'gray','维修':'red','报废':'gray'};
  return pill(map[t]||'gray',t);
}

/* ================= 运维 · 设备库存 ================= */
const INV_TABS=[
  {k:'all',lab:'全部'},
  {k:'stock',lab:'在库可用'},
  {k:'out',lab:'已出库'},
  {k:'returning',lab:'待入库'},
  {k:'repair',lab:'维修'},
  {k:'offshelf',lab:'已下架'}
];
function invFilter(d){
  const k=ui.filters.inv;
  if(k==='stock') return d.status==='stock';
  if(k==='out') return ['in_use','shipping','locked'].includes(d.status);
  if(k==='returning') return ['returning','inspecting'].includes(d.status);
  if(k==='repair') return d.status==='repair';
  if(k==='offshelf') return ['offshelf','scrapped'].includes(d.status);
  return true;
}
function inventory(){
  let list=DB.devices.filter(invFilter);
  if(ui.invModel) list=list.filter(d=>d.model===ui.invModel);
  if(ui.invWh) list=list.filter(d=>d.wh===ui.invWh);
  const q=(ui.q.inv||'').trim().toLowerCase();
  if(q) list=list.filter(d=>(d.sn+(d.order||'')).toLowerCase().includes(q));

  const tabs=INV_TABS.map(t=>{
    const n=DB.devices.filter(d=>{
      if(t.k==='all') return true;
      if(t.k==='stock') return d.status==='stock';
      if(t.k==='out') return ['in_use','shipping','locked'].includes(d.status);
      if(t.k==='returning') return ['returning','inspecting'].includes(d.status);
      if(t.k==='repair') return d.status==='repair';
      return ['offshelf','scrapped'].includes(d.status);
    }).length;
    return '<button class="chip'+(ui.filters.inv===t.k?' on':'')+'" data-act="filter-inv" data-k="'+t.k+'">'+t.lab+'<b>'+n+'</b></button>';
  }).join('');

  const rows=list.map(d=>{
    const sel=ui.selected.has(d.sn);
    let op='';
    if(d.status==='stock') op='<a class="link" data-act="unshelve" data-sn="'+d.sn+'">下架</a>';
    else if(d.status==='offshelf') op='<a class="link" data-act="shelve" data-sn="'+d.sn+'">上架</a>';
    else if(d.status==='returning') op='<a class="link" data-act="inspect" data-sn="'+d.sn+'">入库检测</a>';
    else if(d.status==='inspecting') op='<a class="link" data-act="shelve" data-sn="'+d.sn+'">检测通过上架</a>';
    else if(d.status==='repair') op='<a class="link" data-act="shelve" data-sn="'+d.sn+'">修复上架</a>';
    return '<tr class="'+(sel?'sel':'')+'">'
      + '<td class="no-l" style="width:40px"><span class="cb'+(sel?' on':'')+'" data-act="sel" data-sn="'+d.sn+'" role="checkbox" aria-checked="'+sel+'" tabindex="0"></span></td>'
      + '<td data-l="设备 SN"><div class="mono">'+d.sn+'</div><div class="cell-sub">'+MODELS[d.model].name+'</div></td>'
      + '<td data-l="状态">'+dPill(d)+'</td>'
      + '<td data-l="仓库">'+esc(d.wh)+'</td>'
      + '<td data-l="容量" class="mono">'+d.cap+' TB</td>'
      + '<td data-l="固件" class="mono muted">'+d.fw+'</td>'
      + '<td data-l="所属订单" class="mono">'+(d.order?'<a class="link" data-act="ops-order" data-id="'+d.order+'">'+d.order+'</a>':'—')+'</td>'
      + '<td data-l="最后心跳" class="mono muted">'+d.hb+'</td>'
      + '<td data-l="操作" class="no-l"><div class="ops">'+op+'<a class="link" data-act="ops-device" data-sn="'+d.sn+'">详情</a></div></td></tr>';
  }).join('');

  const batch=ui.selected.size
    ? '<div class="batchbar"><span>已选 <b class="mono">'+ui.selected.size+'</b> 台设备</span><span style="flex:1"></span>'
      + '<button class="btn btn-sm" data-act="batch-shelve">批量上架</button>'
      + '<button class="btn btn-sm" data-act="batch-unshelve">批量下架</button>'
      + '<button class="btn btn-sm btn-ghost" data-act="batch-clear">取消选择</button></div>'
    : '';

  return head('设备库存','共 '+DB.devices.length+' 台 · 在库可用 '+DB.devices.filter(d=>d.status==='stock').length+' 台 · 待入库 '+DB.devices.filter(d=>d.status==='returning').length+' 台',
      '<button class="btn" data-act="export">'+ic('down',14)+'导出</button><button class="btn btn-primary" data-act="add-stock">'+ic('plus',14)+'设备入库</button>')
    + '<div class="panel"><div class="filterbar">'
      + '<div class="chips">'+tabs+'</div><span class="grow"></span>'
      + '<select class="select" id="invModel"><option value="">全部型号</option>'
        + Object.keys(MODELS).map(k=>'<option value="'+k+'"'+(ui.invModel===k?' selected':'')+'>'+MODELS[k].name+'</option>').join('')+'</select>'
      + '<select class="select" id="invWh"><option value="">全部仓库</option>'
        + ['杭州仓','上海仓','广州仓'].map(w=>'<option'+(ui.invWh===w?' selected':'')+'>'+w+'</option>').join('')+'</select>'
      + '<label class="search">'+ic('search',14)+'<input class="input" id="qInv" data-q="inv" placeholder="搜索 SN / 订单号" value="'+esc(ui.q.inv)+'"></label>'
    + '</div>'+batch
    + '<div class="tbl-scroll"><table class="tbl"><thead><tr><th style="width:40px"></th><th>设备 SN</th><th>状态</th><th>仓库</th><th>容量</th><th>固件</th><th>所属订单</th><th>最后心跳</th><th style="text-align:right">操作</th></tr></thead>'
    + '<tbody>'+(list.length?rows:'<tr><td colspan="9">'+emptyBox('没有匹配的设备','调整筛选条件或清空关键词','<button class="btn btn-sm" data-act="reset-inv">清空筛选</button>')+'</td></tr>')+'</tbody></table></div>'
    + pager(DB.devices.length,list.length)+'</div>';
}

/* ================= 运维 · 订单受理 ================= */
function opsOrders(){
  let list=DB.orders.slice();

/* ================= 交互层 ================= */
function nowStr(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function todayCode(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
}
function addLog(o,what,note,who){
  o.logs.unshift({t:nowStr(),who:who||('运维 · '+DB.opsUser.name),what:what,note:note||''});
}
function addMove(type,sn,order,note){
  DB.moves.unshift({t:nowStr(),type:type,sn:sn,order:order||'—',by:DB.opsUser.name,note:note||''});
}
function syncOrder(o){
  if(!o || o.status!=='returning') return;
  const ds=o.devices.map(deviceBySn).filter(Boolean);
  if(ds.length && ds.every(d=>d.status==='stock')){
    o.status='completed'; o.completedAt=nowStr();
    addLog(o,'设备入库检测通过','全部设备已恢复上架，订单关闭');
    toast('订单 '+o.id+' 已完成');
  }
}
function modalShell(title,body,footer){
  return '<div class="modal-head"><span>'+title+'</span><button class="x" data-act="close" aria-label="关闭">'+ic('close',16)+'</button></div>'
    + '<div class="modal-body">'+body+'</div>'
    + (footer?'<div class="modal-foot">'+footer+'</div>':'');
}

      + '<b>下单</b>：创建订单 → 选型号与租期 → 填写迁移配置 → 提交，等待运维受理。<br><br>'
      + '<b>使用</b>：设备送达后「确认收货」，设备进入使用中，可查看实时迁移速率与容量。<br><br>'
      + '<b>归还</b>：订单详情点「申请归还」，寄出后在运维后台「设备库存」完成入库检测与上架，订单自动完成。'
      + '</div>',
      '<button class="btn btn-primary" data-act="close">知道了</button>')),
  'demo-tip':()=>openModal(modalShell('原型演示路径',
      '<div style="line-height:24px">'
      + '<span class="tag">1</span> 客户控制台 →「创建订单」→ 三步向导 → 提交<br>'
      + '<span class="tag">2</span> 切到「运维后台」→ 订单受理 →「受理发货」<br>'
      + '<span class="tag">3</span> 回客户控制台 → 订单详情 →「确认收货」<br>'
      + '<span class="tag">4</span> 订单详情 →「申请归还」<br>'
      + '<span class="tag">5</span> 运维后台 → 设备库存 →「入库检测」→「检测通过上架」<br>'
      + '<span class="tag">6</span> 回客户控制台，订单状态自动变为「已完成」'
      + '</div>',
      '<button class="btn btn-primary" data-act="close">开始体验</button>')),
  'export':()=>toast('导出任务已创建，完成后将发送到企业邮箱'),
  'report':el=>toast('工单已提交：'+el.dataset.sn+'，运维将在 4 小时内响应'),
  'restart':el=>toast('已下发重启指令：'+el.dataset.sn),

  /* 运维动作 */
  'accept-order':el=>{
    const o=orderById(el.dataset.id); if(!o) return;
    const devs=o.devices.map(deviceBySn).filter(Boolean);
    openModal(modalShell('受理发货 · '+o.id,
      '<div class="notice notice-info" style="margin-bottom:14px">'+ic('info',15)+'<div>受理后设备将锁定并出库，客户签收确认后开始计费。</div></div>'
      + '<div class="dl" style="margin-bottom:14px"><dt>客户</dt><dd>示例科技有限公司 · '+esc(o.contact)+'</dd>'
      + '<dt>交付站点</dt><dd>'+esc(o.site)+'</dd><dt>设备</dt><dd>'+o.qty+' 台 · '+MODELS[o.model].name+'</dd></div>'
      + '<div class="field"><label>分配设备（已按型号锁定）</label><div style="font-family:var(--mono);font-size:12.5px;line-height:22px;color:var(--text-2)">'
      + (devs.length?devs.map(d=>d.sn+' · '+d.wh).join('<br>'):'库存不足，需先调拨')+'</div></div>',
      '<button class="btn" data-act="close">取消</button><button class="btn btn-primary" data-act="do-accept" data-id="'+o.id+'">确认受理并发货</button>'));
  },
  'do-accept':el=>{
    const o=orderById(el.dataset.id); if(!o) return;
    o.status='shipping'; o.shippedAt=nowStr();
    o.devices.map(deviceBySn).forEach(d=>{ if(d){ d.status='shipping'; d.rate=0; d.hb=nowStr(); } });
    addLog(o,'订单受理，设备出库','杭州仓 → '+o.site);
    o.devices.forEach(sn=>addMove('出库',sn,o.id,'受理发货 '+o.site));
    closeModal(); render(); toast('已受理并发货，等待客户确认收货');
  },
  'ops-order-modal':el=>{
    const o=orderById(el.dataset.id); if(!o) return;
    const ds=o.devices.map(deviceBySn).filter(Boolean);
    openModal(modalShell('订单 '+o.id,
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">'+oPill(o)+'<span class="muted" style="font-size:12.5px">'+esc(o.project)+'</span></div>'
      + '<div class="dl"><dt>客户</dt><dd>示例科技有限公司 · '+esc(o.contact)+'</dd><dt>设备数量</dt><dd>'+o.qty+' 台 · '+MODELS[o.model].name+'</dd>'
      + '<dt>创建时间</dt><dd class="mono">'+o.createdAt+'</dd><dt>确认时间</dt><dd class="mono">'+(o.confirmedAt||'—')+'</dd>'
      + '<dt>设备 SN</dt><dd class="mono">'+(ds.length?ds.map(d=>d.sn+'（'+DS[d.status].lab+'）').join('<br>'):'未分配')+'</dd></div>'
      + '<div style="margin-top:18px">'+railHTML(o,true)+'</div>',
      (o.status==='pending'?'<button class="btn btn-primary" data-act="accept-order" data-id="'+o.id+'">受理发货</button>':'')
      + '<button class="btn" data-act="close">关闭</button>'));
  },
  'sel':el=>{
    const sn=el.dataset.sn;
    if(ui.selected.has(sn)) ui.selected.delete(sn); else ui.selected.add(sn);
    render();
  },
  'batch-shelve':()=>{
    let n=0;
    ui.selected.forEach(sn=>{
      const d=deviceBySn(sn);
      if(d && ['offshelf','inspecting','repair'].includes(d.status)){
        d.status='stock'; d.hb=nowStr(); addMove('上架',sn,d.order||'—','批量上架'); n++;
      }
    });
    ui.selected.clear(); render(); toast(n?('已上架 '+n+' 台设备'):'所选设备当前状态不可上架');
  },
  'batch-unshelve':()=>{
    let n=0;
    ui.selected.forEach(sn=>{
      const d=deviceBySn(sn);
      if(d && d.status==='stock'){ d.status='offshelf'; addMove('下架',sn,d.order||'—','批量下架'); n++; }
    });
    ui.selected.clear(); render(); toast(n?('已下架 '+n+' 台设备'):'所选设备当前状态不可下架');
  },
  'batch-clear':()=>{ ui.selected.clear(); render(); },
  'shelve':el=>{
    const d=deviceBySn(el.dataset.sn); if(!d) return;
    const from=d.status;
    d.status='stock'; d.hb=nowStr(); d.temp=24;
    addMove('上架',d.sn,d.order||'—',from==='inspecting'?'入库检测通过':'恢复可用');
    if(d.order) syncOrder(orderById(d.order));
    render(); toast(d.sn+' 已上架，状态：在库可用');
  },
  'unshelve':el=>{
    const d=deviceBySn(el.dataset.sn); if(!d) return;
    d.status='offshelf';
    addMove('下架',d.sn,d.order||'—','暂停出租');
    render(); toast(d.sn+' 已下架');
  },
  'inspect':el=>{
    const d=deviceBySn(el.dataset.sn); if(!d) return;
    d.status='inspecting';
    addMove('入库',d.sn,d.order||'—','签收并开始检测');
    render(); toast('已登记入库，'+d.sn+' 检测中');
  },
  'repair':el=>{
    const d=deviceBySn(el.dataset.sn); if(!d) return;
    d.status='repair';
    addMove('维修',d.sn,d.order||'—','转维修区');
    render(); toast(d.sn+' 已转维修');
  },
  'scrap':el=>{
    const d=deviceBySn(el.dataset.sn); if(!d) return;
    d.status='scrapped';
    addMove('报废',d.sn,d.order||'—','固定资产报废');
    render(); toast(d.sn+' 已登记报废');
  },
  'add-stock':()=>{
    openModal(modalShell('设备入库',
      '<div class="field-row"><div class="field"><label>设备 SN</label><input class="input" id="addSn" placeholder="例如：DM3-2402-0190"></div>'
      + '<div class="field"><label>型号</label><select class="select" id="addModel">'+Object.keys(MODELS).map(k=>'<option value="'+k+'">'+MODELS[k].name+'</option>').join('')+'</select></div></div>'
      + '<div class="field-row"><div class="field"><label>仓库</label><select class="select" id="addWh"><option>杭州仓</option><option>上海仓</option><option>广州仓</option></select></div>'
      + '<div class="field"><label>固件版本</label><input class="input" id="addFw" value="4.1.0"></div></div>'
      + '<div class="notice notice-gray">'+ic('info',15)+'<div>入库后设备状态为「在库可用」，可立即用于订单分配。</div></div>',
      '<button class="btn" data-act="close">取消</button><button class="btn btn-primary" data-act="do-add-stock">确认入库</button>'));
  },
  'do-add-stock':()=>{
    const sn=(document.querySelector('#addSn').value||'').trim().toUpperCase();
    if(!sn){ toast('请填写设备 SN'); return; }
    if(deviceBySn(sn)){ toast('该 SN 已存在'); return; }
    const model=document.querySelector('#addModel').value;
    const wh=document.querySelector('#addWh').value;
    const fw=document.querySelector('#addFw').value||'4.1.0';
    DB.devices.unshift({sn:sn,model:model,status:'stock',wh:wh,fw:fw,used:0,cap:MODELS[model].cap,order:null,hb:nowStr(),site:wh,since:nowStr().slice(0,10),temp:24,rate:0});
    addMove('入库',sn,'—','新设备入库');
    closeModal(); render(); toast(sn+' 已入库');
  }
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const fn=ACT[el.dataset.act];
  if(!fn) return;
  e.preventDefault();
  fn(el);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target.closest('[data-act]');
  if(el && el.getAttribute('tabindex')==='0'){ e.preventDefault(); el.click(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.q){ ui.q[t.dataset.q]=t.value; render(); return; }
  if(t.dataset.bind && ui.page==='ordernew'){
    ui.wiz.form[t.dataset.bind]=t.value;
    if(t.dataset.bind==='dataSize') updateWizSum();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='invModel'){ ui.invModel=t.value; render(); return; }
  if(t.id==='invWh'){ ui.invWh=t.value; render(); return; }
  if(t.dataset.bind && ui.page==='ordernew'){ ui.wiz.form[t.dataset.bind]=t.value; }
});

/* 初始化 */
document.body.classList.add('app');
ui.filters.dev='all'; ui.q.dev=''; ui.filters.mv='all'; ui.q.mv='';
ui.wiz.form.site='杭州 · 滨江数据中心 A1';
ui.wiz.form.project='智驾路测数据回传';
render();
</script>
</body>
</html>
